name: Build SG BUSINESS CONNECT RDC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Construire l'APK
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.0'
          cache: true

      - name: Vérifier Flutter
        run: |
          flutter --version
          dart --version

      - name: Trouver le ZIP du projet
        id: zip
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -name '*.zip' | head -1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERREUR : aucun fichier ZIP trouvé."
            exit 1
          fi

          echo "ZIP trouvé : $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extraire le projet
        shell: bash
        run: |
          rm -rf extracted_project
          mkdir -p extracted_project

          unzip -q "${{ steps.zip.outputs.zip_file }}" -d extracted_project

          echo "Projet extrait :"
          find extracted_project -maxdepth 3 -type f | head -100

      - name: Localiser le projet Flutter
        id: project
        shell: bash
        run: |
          PUBSPEC=$(find extracted_project -type f -name pubspec.yaml | head -1)

          if [ -z "$PUBSPEC" ]; then
            echo "ERREUR : pubspec.yaml introuvable."
            find extracted_project -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Projet Flutter : $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Régénérer complètement Android
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          rm -rf android

          flutter create \
            --platforms=android \
            --org com.sg.businessconnect \
            --project-name sg_business_connect_rdc \
            .

      - name: Installer les dépendances
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          flutter clean
          flutter pub get
      - name: Corriger les erreurs Dart connues
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          candidates = list(Path('.').rglob('login_page.dart'))
          for login in candidates:
              text = login.read_text()
              old = "Text('Impossible d'envoyer le lien : $e')"
              new = 'Text("Impossible d\'envoyer le lien : $e")'
              if old in text:
                  login.write_text(text.replace(old, new, 1))
                  print(f"Correction appliquée : {login}")

          candidates = list(Path('.').rglob('wallet_service.dart'))
          for wallet in candidates:
              text = wallet.read_text()
              old = ".eq('wallet_id', await _walletId(user.id))"
              new = ".eq('wallet_id', await _walletId(user.id) ?? (throw Exception('Wallet ID introuvable')))"
              if old in text:
                  wallet.write_text(text.replace(old, new, 1))
                  print(f"Correction appliquée : {wallet}")

          PY

          dart format lib
          flutter analyze

      - name: Vérifier les secrets Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "ERREUR : SUPABASE_URL absent."
            exit 1
          fi

          if [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "ERREUR : SUPABASE_PUBLISHABLE_KEY absent."
            exit 1
          fi

          echo "Les secrets Supabase sont disponibles."

      - name: Configurer le Deep Link
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")

          text = manifest.read_text()

          text = text.replace(
              '<activity\n',
              '<activity\n'
              '            android:name=".MainActivity"\n'
              '            android:exported="true"\n',
              1
          )

          intent_filter = '''
              <intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="sgbusinessconnect" android:host="auth" android:path="/callback/" />
              </intent-filter>
          '''

          marker = '</activity>'

          if 'android:scheme="sgbusinessconnect"' not in text:
              text = text.replace(marker, intent_filter + '\n        ' + marker, 1)

          manifest.write_text(text)
          PY

      - name: Construire APK Release
        working-directory: ${{ steps.project.outputs.project_dir }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Vérifier le fichier APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          echo "APK généré :"
          ls -lh build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: SG-BUSINESS-CONNECT-RDC-APK
          path: ${{ steps.project.outputs.project_dir }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7        
