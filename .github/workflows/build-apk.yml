name: Build SG BUSINESS CONNECT RDC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Construire l'APK
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v6

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.0'
          cache: true

      - name: Vérifier Flutter
        run: |
          flutter --version
          dart --version

      - name: Trouver le fichier ZIP
        id: zip
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -name '*.zip' | head -1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERREUR: aucun fichier ZIP du projet n'a été trouvé."
            exit 1
          fi

          echo "ZIP trouvé : $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extraire le projet Flutter
        shell: bash
        run: |
          rm -rf extracted_project
          mkdir -p extracted_project

          unzip -q "${{ steps.zip.outputs.zip_file }}" -d extracted_project

          echo "Contenu extrait :"
          find extracted_project -maxdepth 3 -type f | head -100

      - name: Localiser le projet Flutter
        id: project
        shell: bash
        run: |
          PUBSPEC=$(find extracted_project -type f -name pubspec.yaml | head -1)

          if [ -z "$PUBSPEC" ]; then
            echo "ERREUR: pubspec.yaml introuvable."
            echo "Fichiers trouvés :"
            find extracted_project -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Projet Flutter trouvé dans : $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Préparer Android
        shell: bash
        run: |
          cd "${{ steps.project.outputs.project_dir }}"

          if [ ! -d "android" ]; then
            echo "Dossier Android absent : génération de la plateforme Android."
            flutter create --platforms=android .
          else
            echo "Dossier Android déjà présent."
          fi

      - name: Installer les dépendances
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          flutter clean
          flutter pub get

      - name: Vérifier les secrets Supabase
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "ERREUR: SUPABASE_URL est absent."
            exit 1
          fi

          if [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "ERREUR: SUPABASE_PUBLISHABLE_KEY est absent."
            exit 1
          fi

          echo "Les deux secrets Supabase sont disponibles."

      - name: Construire l'APK Release
        working-directory: ${{ steps.project.outputs.project_dir }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Vérifier l'APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          ls -lh build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Publier l'APK
        uses: actions/upload-artifact@v7
        with:
          name: SG-BUSINESS-CONNECT-RDC-APK
          path: ${{ steps.project.outputs.project_dir }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
